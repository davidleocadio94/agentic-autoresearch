<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}agentic-autoresearch{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 1.5rem; max-width: 1200px; color: #222; }
    h1, h2 { font-weight: 600; }
    nav a { margin-right: 1rem; color: #06c; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
    th { background: #fafafa; }
    .pill { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
    .pill-running { background: #d1fae5; color: #065f46; }
    .pill-done    { background: #e5e7eb; color: #374151; }
    .pill-kept    { background: #d1fae5; color: #065f46; }
    .pill-reverted{ background: #fee2e2; color: #991b1b; }
    .pill-failed  { background: #fef3c7; color: #92400e; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .delta-up   { color: #047857; }
    .delta-down { color: #b91c1c; }
  </style>
</head>
<body>
  <nav>
    <a href="/">home</a>
    <a href="/db">db</a>
    <a href="/search">search</a>
    <a href="/health">health</a>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
