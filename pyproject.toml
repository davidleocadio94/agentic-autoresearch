[project]
name = "agentic-autoresearch"
version = "0.1.0"
description = "Plug-in spec.md, get a working repo. Generic Plan/Act/Reflect autoresearch with claude -p."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "matplotlib>=3.8",
    "setproctitle>=1.3",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "rich>=13.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "boto3>=1.43.13",
]

[project.scripts]
autoresearch = "agentic_autoresearch.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_autoresearch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
